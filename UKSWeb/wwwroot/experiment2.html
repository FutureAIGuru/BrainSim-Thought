<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search, Inheritance &amp; Exceptions · BrainSim Thought</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="experiments.css?v=20261105-navigation">
</head>
<body class="guided-demo query-demo">
  <main>
    <aside>
      <div class="chapter">Searching / Inheritance / Exceptions</div>
      <div class="progress" aria-label="Experiment progress"></div>
      <p id="step-number" class="eyebrow"></p>
      <div class="prompt-content"><h1 id="prompt-title"></h1><div id="prompt-copy"></div></div>
      <div class="action-zone" role="region" aria-label="Experiment actions" tabindex="0">
        <div id="query-controls" aria-label="Query controls"></div>
        <div id="choices" role="region" aria-label="Experiment content" tabindex="0"></div>
      </div>
      <div id="query-results" role="region" aria-label="Query results" tabindex="0"><p>Choose a Thought to see its attributes.</p></div>
      <p id="feedback" role="status" aria-live="polite">Connecting to the UKS…</p>
      <div class="invitation" role="region" aria-label="Try this" tabindex="0"><span>Try this</span><div id="try-this"></div></div>
      <nav aria-label="Experiments"><button id="back">← Back</button><button id="next" class="primary">Next →</button></nav>
    </aside>
    <section class="workspace" aria-label="Knowledge graph">
      <div class="graph-toolbar">
        <form id="root-form"><label for="root">Root</label><select id="root"><option>Fido</option><option>Tripper</option><option>robot-dog</option><option>Felix</option><option>Tweety</option><option>dog</option><option>cat</option><option>bird</option><option>animal</option></select><datalist id="root-options"></datalist><button id="load-root">Show</button></form>
        <button id="fit" type="button">Fit view</button><button id="reset-content" type="button" title="Reset demo content and return to the first step">Reset Content</button><button id="help" type="button" aria-haspopup="dialog">Help</button>
      </div>
      <div class="canvas"><div id="graph" aria-label="Interactive knowledge graph"></div><div id="selection" role="status" aria-live="polite"></div></div>
      <div class="graph-key" aria-label="Node color key"><span><i class="gold"></i>Root</span><span><i class="blue"></i>Thought</span><span><i class="green"></i>Expanded</span><span><i class="purple"></i>Relationship</span><span><i class="orange"></i>Supporting relationship</span><small id="counts"></small></div>
    </section>
  </main>
  <dialog id="attribute-box" aria-label="Manage attributes"></dialog>
  <dialog id="help-box" aria-labelledby="help-title"><p id="inactivity-note"></p></dialog>
  <p id="sandbox-status" role="status"></p>
  <!-- Existing session management is shared with the editor; XML selection is not part of this guided demo. -->
  <select id="demo-select" hidden><option value="__choose">Choose</option><option value="">Standard UKS</option></select>
  <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.1/dist/3d-force-graph.min.js" crossorigin="anonymous"></script>
  <script type="module">
    import { startExperiment } from './experiments.js?v=20261105-navigation';
    const facts = [
      {source:'animal',relationshipType:'is-a',target:'Object',caption:'animal is an Object'},
      {source:'dog',relationshipType:'is-a',target:'animal',caption:'dog is an animal'},
      {source:'cat',relationshipType:'is-a',target:'animal',caption:'cat is an animal'},
      {source:'bird',relationshipType:'is-a',target:'animal',caption:'bird is an animal'},
      {source:'Fido',relationshipType:'is-a',target:'dog',caption:'Fido is a dog'},
      {source:'Tripper',relationshipType:'is-a',target:'dog',caption:'Tripper is a dog'},
      {source:'Felix',relationshipType:'is-a',target:'cat',caption:'Felix is a cat'},
      {source:'Tweety',relationshipType:'is-a',target:'bird',caption:'Tweety is a bird'},
      {source:'animal',relationshipType:'needs',target:'food',caption:'animal needs food'},
      {source:'dog',relationshipType:'has',target:'fur',caption:'dog has fur'},
      {source:'dog',relationshipType:'has.4',target:'"legs"',targetLabel:'legs',caption:'dog has four legs'},
      {source:'dog',relationshipType:'makes',target:'barking-sound',caption:'dog makes a barking sound'},
      {source:'cat',relationshipType:'has',target:'fur',caption:'cat has fur'},
      {source:'cat',relationshipType:'has.4',target:'"legs"',targetLabel:'legs',caption:'cat has four legs'},
      {source:'cat',relationshipType:'makes',target:'meowing-sound',caption:'cat makes a meowing sound'},
      {source:'bird',relationshipType:'has',target:'"wings"',targetLabel:'wings',caption:'bird has wings'},
      {source:'bird',relationshipType:'has.2',target:'"legs"',targetLabel:'legs',caption:'bird has two legs'},
      {source:'Fido',relationshipType:'is',target:'brown',caption:'Fido is brown'},
      {source:'Felix',relationshipType:'is',target:'black',caption:'Felix is black'},
      {source:'Tripper',relationshipType:'has.3',target:'"legs"',targetLabel:'legs',caption:'Tripper has three legs'},
      {source:'dog',relationshipType:'has',target:'tail',caption:'dog has a tail'},
      {source:'robot-dog',relationshipType:'is-a',target:'dog',caption:'robot-dog is a dog'},
      {source:'robot-dog',relationshipType:'needs.NOT',target:'food',caption:'robot-dog does not need food'},
      {source:'robot-dog',relationshipType:'has.NOT',target:'fur',caption:'robot-dog does not have fur'},
      {source:'Tripper',relationshipType:'makes.NOT',target:'barking-sound',caption:'Tripper does not bark'}
    ];
    const steps = [
      {title:'What do we know about it?', query:'attributes', inheritChoices:false, choices:[{component:'thought-selector',id:'subject'}, {component:'attribute-editor'}, {component:'attribute-results',source:'subject'}],
        copy:'Choose a Thought. Its results include both direct attributes and attributes inherited from its categories.',
        try:'Look up Fido, then dog. Select a result to highlight its supporting relationships in the graph.'},
      {title:'Find something by its attributes.', query:'candidates', inheritChoices:false, choices:[{component:'attribute-search',id:'search'}, {component:'attribute-editor'}, {component:'candidate-results',source:'search'}],
        copy:'Select one or more attributes and ask the UKS for likely candidates. The graph can show several results together.',
        try:'Start with has → fur. Add is → brown, or try makes → barking-sound. Click a candidate to inspect its attributes.'},
      {title:'A specific exception wins.', query:'exceptions', inheritChoices:false, choices:[{component:'thought-selector',id:'subject'},19,22,23,24, {component:'attribute-editor'}, {component:'attribute-results',source:'subject'}],
        copy:'Choose Tripper to see his inherited four legs. Add his explicit three-leg exception and watch the inherited attribute disappear.',
        try:'Add and remove the offered relationships. Try robot-dog: it inherits a need for food until you add the explicit exception.'}
    ];
    await startExperiment({facts, steps, seedIfMissing:'Tweety', initialFacts:facts.map((_,index)=>index).filter(index=>![19,22,23,24].includes(index)), seedGroups:[{thought:'robot-dog',facts:[21]}],
      query:{root:'animal',subjects:['Fido','Tripper','robot-dog','Felix','Tweety','dog','cat','bird','animal'],exceptionSubjects:['Tripper','robot-dog','Fido'],
        types:['is','has','has.2','has.3','has.4','has.NOT','makes','makes.NOT','needs','needs.NOT'],
        targets:['brown','black','friendly','fur','tail','legs','wings','food','barking-sound','meowing-sound'],
        attributes:[{relationshipType:'has',target:'fur'},{relationshipType:'is',target:'brown'},
          {relationshipType:'makes',target:'barking-sound'},{relationshipType:'has.4',target:'legs'},
          {relationshipType:'has',target:'wings'},{relationshipType:'is',target:'black'}]}});
  </script>
</body>
</html>
