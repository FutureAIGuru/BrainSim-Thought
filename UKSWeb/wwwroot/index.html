<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrainSim Thought · UKS</title>
  <style>
    :root { font: 16px/1.4 system-ui, sans-serif; color: #183043; background: #f1f5f7; }
    * { box-sizing: border-box; }
    body { max-width: 1000px; height: calc(100dvh - 2rem); min-height: 560px; margin: 1rem auto; padding: 0 1rem; display: flex; flex-direction: column; gap: .65rem; }
    h1 { font-size: 1.65rem; margin: 0 0 .15rem; }
    h2 { margin: 0 0 .6rem; font-size: 1.15rem; }
    header p { margin: .15rem 0; color: #4b6270; }
    main { display: flex; flex-direction: column; flex: 1; min-height: 0; gap: .65rem; }
    section { background: white; border: 1px solid #ccd9df; border-radius: 10px; padding: .85rem; }
    .content-section { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; align-items: end; gap: .6rem; }
    #children-form { display: flex; align-items: end; gap: .6rem; }
    label { display: flex; flex: 1; flex-direction: column; min-width: 0; gap: .2rem; }
    input, button, select { font: inherit; border-radius: 6px; padding: .45rem .6rem; }
    .top-line { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .demo-picker { flex: 0 1 auto; display: flex; flex-direction: row; align-items: center; gap: .4rem; margin: 0; font-size: .85rem; }
    .demo-picker select { max-width: 220px; }
    #sandbox-status:empty { display: none; }
    #sandbox-status { margin: .2rem 0 0; }
    #sandbox-status.error { color: #a51b29; }
    input { border: 1px solid #859da9; min-width: 0; }
    button { background: #155b74; color: white; border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
    button:disabled { opacity: .6; cursor: wait; }
    :focus-visible { outline: 3px solid #d58d18; outline-offset: 3px; }
    .status { margin: .5rem 0 0; overflow-wrap: anywhere; }
    .status:empty { display: none; }
    .error { color: #a51b29; }
    #children-list { list-style: none; padding: 0 .35rem 0 0; margin: .4rem 0 0; flex: 1; min-height: 0; overflow-y: auto; }
    #children-list li { display: flex; align-items: center; gap: 1rem; padding: .3rem 0; border-bottom: 1px solid #e7edf0; }
    #children-list .relationship { padding: .5rem 0; }
    .child-label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .delete-button { display: inline-flex; flex-shrink: 0; margin: 0; padding: .35rem; background: #a51b29; }
    .delete-button svg { width: 20px; height: 20px; }
    footer, .hint { font-size: .9rem; color: #4b6270; }
    @media (max-width: 500px) {
      .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      body { min-height: 640px; padding: 0 .5rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="top-line">
      <h1>BrainSim Thought</h1>
      <label class="demo-picker">XML<select id="demo-select" aria-label="XML demo" disabled><option value="__choose" disabled>Choose XML file</option><option value="">Standard UKS</option></select></label>
    </div>
    <p>A small window into the Universal Knowledge Store.</p>
    <a id="graph-link" href="/graph.html">Explore UKS in 3D</a>
  </header>
  <main>
    <section aria-labelledby="add-title">
      <h2 id="add-title">Add a relationship</h2>
      <form id="add-form">
        <div class="fields">
          <label>Source<input name="source" value="Fido" required></label>
          <label>Relationship type<input name="relationshipType" value="is-a" required></label>
          <label>Target<input name="target" value="dog" required></label>
          <button type="submit">Add relationship</button>
        </div>
      </form>
      <p id="add-status" class="status" role="status" aria-live="polite"></p>
    </section>
    <section class="content-section" aria-labelledby="children-title">
      <h2 id="children-title">Thought content</h2>
      <form id="children-form">
        <label>Thought label<input name="label" value="Thought" required></label>
        <button type="submit">Show content</button>
      </form>
      <p id="children-status" class="status" role="status" aria-live="polite"></p>
      <ul id="children-list" aria-label="Children and direct relationships" tabindex="0"></ul>
    </section>
  </main>
  <footer>
    <span id="inactivity-note">Edits are deleted after inactivity or a server restart.</span>
    <p id="sandbox-status" role="status" aria-live="polite"></p>
  </footer>
  <script type="module">
    import { sandbox, request } from './sandbox.js?v=20261105-resume';
    const pageParameters = new URLSearchParams(location.search);
    document.querySelector('#graph-link').addEventListener('click', event => {
      const root = document.querySelector('#children-form').elements.label.value.trim() || 'Thought';
      if (!sandbox.available) { event.preventDefault(); return; }
      event.currentTarget.href = sandbox.pageUrl('/graph.html', root);
    });
    function setStatus(element, message, error = false) {
      element.textContent = message;
      element.classList.toggle('error', error);
    }

    const childrenForm = document.querySelector('#children-form');
    if (pageParameters.get('root')) childrenForm.elements.label.value = pageParameters.get('root');
    let watchedLabel = null;
    let renderedKey = '';
    let renderedContent = '';
    let refreshController = null;
    let deleting = false;
    async function showChildren({ automatic = false } = {}) {
      if (!await sandbox.ready) return;
      const selectedSandbox = sandbox.id;
      const label = automatic ? watchedLabel : childrenForm.elements.label.value.trim();
      if (automatic && (refreshController || deleting || document.hidden)) return;
      refreshController?.abort();
      watchedLabel = label || null;
      if (!automatic) sandbox.updateRoot(label);
      const status = document.querySelector('#children-status');
      const list = document.querySelector('#children-list');
      const button = childrenForm.querySelector('button');
      const key = JSON.stringify([selectedSandbox, label]);
      if (key !== renderedKey) {
        list.replaceChildren();
        renderedContent = '';
        renderedKey = key;
      }
      if (!label) {
        refreshController = null;
        button.disabled = false;
        setStatus(status, 'Enter a Thought label.');
        return;
      }
      const controller = new AbortController();
      refreshController = controller;
      const timeout = setTimeout(() => controller.abort(), 10000);
      if (!automatic) {
        button.disabled = true;
        setStatus(status, 'Loading…');
      }
      try {
        // === WEB SERVICE: GET /api/children — retrieve the selected Thought’s children and direct Relationships for the table. ===
        const data = await request('/api/children?label=' + encodeURIComponent(label), { signal: controller.signal, automatic });
        if (controller !== refreshController || selectedSandbox !== sandbox.id) return;
        const summary = `${data.label}: ${data.children.length} children · ${data.relationships.length} direct relationships. Auto-refresh: 2s.`;
        const content = JSON.stringify(data);
        if (content === renderedContent) {
          setStatus(status, summary);
          return;
        }
        const scrollTop = list.scrollTop;
        const focusedLabel = list.contains(document.activeElement)
          ? document.activeElement.getAttribute('aria-label') : null;
        function deleteButton(description, url) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'delete-button';
          button.disabled = !sandbox.available;
          button.title = `Delete ${description}`;
          button.setAttribute('aria-label', `Delete ${description}`);
          button.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>';
          button.addEventListener('click', async () => {
            if (deleting) return;
            deleting = true;
            refreshController?.abort();
            button.disabled = true;
            setStatus(status, `Deleting ${description}…`);
            try {
              // === WEB SERVICE: DELETE /api/thoughts or /api/relationships — remove the item represented by this row; url selects the endpoint. ===
              await request(url, { method: 'DELETE' });
              await showChildren();
            } catch (error) {
              setStatus(status, error.message, true);
              button.disabled = !sandbox.available;
            } finally {
              deleting = false;
            }
          });
          return button;
        }
        const items = data.children.map(child => {
          const item = document.createElement('li');
          const name = document.createElement('span');
          name.className = 'child-label';
          name.textContent = child.label;
          item.append(name, deleteButton(`Thought ${child.label}`, '/api/thoughts?label=' + encodeURIComponent(child.label)));
          return item;
        });
        const relationships = data.relationships.map(relationship => {
          const item = document.createElement('li');
          item.className = 'relationship';
          const name = document.createElement('span');
          name.className = 'child-label';
          name.textContent = `[${relationship.source} → ${relationship.relationshipType ?? '(no type)'} → ${relationship.target ?? '(no target)'}]`;
          item.append(name, deleteButton(`relationship ${name.textContent}`, '/api/relationships?id=' + relationship.id));
          return item;
        });
        list.replaceChildren(...items, ...relationships);
        list.scrollTop = scrollTop;
        if (focusedLabel) {
          const replacement = Array.from(list.querySelectorAll('button'))
            .find(button => button.getAttribute('aria-label') === focusedLabel);
          if (replacement) replacement.focus({ preventScroll: true });
          else list.focus({ preventScroll: true });
        }
        renderedContent = content;
        setStatus(status, summary);
      } catch (error) {
        if (controller === refreshController && !deleting && selectedSandbox === sandbox.id) {
          if (error.code === 'sandbox_unavailable') watchedLabel = null;
          if (error.status === 404) {
            list.replaceChildren();
            renderedContent = '';
          }
          setStatus(status, controller.signal.aborted ? 'Refresh timed out. Retrying automatically…' : error.message, true);
        }
      } finally {
        clearTimeout(timeout);
        if (controller === refreshController) {
          refreshController = null;
          button.disabled = false;
        }
      }
    }

    setInterval(() => {
      if (watchedLabel && sandbox.available) showChildren({ automatic: true });
    }, 2000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && watchedLabel && sandbox.available) showChildren({ automatic: true });
    });

    childrenForm.addEventListener('submit', event => {
      event.preventDefault();
      showChildren();
    });

    document.querySelector('#add-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('button');
      const status = document.querySelector('#add-status');
      button.disabled = true;
      setStatus(status, 'Adding…');
      try {
        // === WEB SERVICE: POST /api/statements — send the three form fields unchanged to the common server-side parser. ===
        const data = await request('/api/statements', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(form)))
        });
        setStatus(status, `Added [${data.source} → ${data.relationshipType} → ${data.target}].`);
        if (childrenForm.elements.label.value.trim()) await showChildren();
      } catch (error) {
        setStatus(status, error.message, true);
      } finally {
        button.disabled = !sandbox.available;
      }
    });
    if (await sandbox.ready) {
      document.querySelector('#graph-link').href = sandbox.pageUrl('/graph.html', childrenForm.elements.label.value.trim());
      showChildren();
    }
  </script>
</body>
</html>
